<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@600&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#14130f;font-family:Inter,sans-serif;color:#f2f0e8}
.dots{position:absolute;inset:0;background-image:radial-gradient(#3d3a30 1.6px,transparent 1.8px);background-size:18px 18px;opacity:.55;
 -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 55%);mask-image:linear-gradient(90deg,transparent 0%,#000 55%)}
.left{position:absolute;left:72px;top:72px;width:620px}
.kicker{font:600 26px "JetBrains Mono",monospace;letter-spacing:.14em;color:#f54e00;text-transform:uppercase}
h1{margin-top:28px;font-weight:700;font-size:82px;line-height:1.02;letter-spacing:-.035em}
.sub{margin-top:30px;font-size:32px;line-height:1.3;color:#d6d3c9;font-weight:500}
.sub b{color:#f2f0e8;font-weight:700}
.stamps{position:absolute;right:56px;top:58px;width:430px;height:514px}
.st{position:absolute;padding:16px 22px;border:5px solid;border-radius:14px;font:600 25px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;background:rgba(20,19,15,.72);white-space:nowrap}
.st small{display:block;font:600 15px "JetBrains Mono",monospace;letter-spacing:.18em;opacity:.8;margin-bottom:4px}
</style></head><body>
<div class="dots"></div>
<div class="left">
  <div class="kicker">For IR majors</div>
  <h1>Where do you fit in tech?</h1>
  <p class="sub">Take the <b>7-question passport quiz</b>. Get your visa, the companies hiring for it, and what to do first.</p>
</div>
<div class="stamps">
  <div class="st" style="color:#9fbbe0;border-color:#9fbbe0;left:40px;top:0;transform:rotate(-6deg)"><small>Visa</small>Policy</div>
  <div class="st" style="color:#dfa88f;border-color:#dfa88f;left:210px;top:70px;transform:rotate(7deg)"><small>Visa</small>Defense</div>
  <div class="st" style="color:#9fc9a2;border-color:#9fc9a2;left:0;top:178px;transform:rotate(4deg)"><small>Visa</small>Trust &amp; safety</div>
  <div class="st" style="color:#c0a8dd;border-color:#c0a8dd;left:150px;top:298px;transform:rotate(-5deg)"><small>Visa</small>Expansion</div>
  <div class="st" style="color:#d9a85c;border-color:#d9a85c;left:20px;top:410px;transform:rotate(3deg)"><small>Visa</small>Geopolitical risk</div>
</div>
</body></html>
